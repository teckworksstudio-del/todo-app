<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>

    <h1>Todo List</h1>

    <ul>
        <li th:each="todo : ${todos}">
            <span th:text="${todo.title}"></span>
            <span th:if="${todo.dueDate != null}"
                  th:text="'期限: ' + ${todo.dueDate}"></span>
        </li>
    </ul>

</body>
</html>
